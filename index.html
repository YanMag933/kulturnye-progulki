<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Культурные прогулки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=28" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body class="home-body">
  <div class="phone-shell home-shell">
    <div class="home-atmosphere" aria-hidden="true"></div>
    <main class="home home-premium">
      <header class="home-brand">
        <img class="home-logo home-logo-lg" src="icon-512.png" width="96" height="96" alt="" />
        <p class="eyebrow">Москва</p>
        <h1>Культурные<br />прогулки</h1>
        <p class="home-lead">Квесты по памятникам и улицам — с телефона, без компьютера.</p>
      </header>

      <nav class="home-actions" aria-label="Главное меню">
        <a class="home-cta walk" href="walk.html?v=28">
          <span class="home-cta-label">Начать</span>
          <span class="home-cta-title">Гулять</span>
        </a>
        <a class="home-cta test" href="walk.html?test=1&v=27">
          <span class="home-cta-label">Просмотр</span>
          <span class="home-cta-title">Тестовая прогулка</span>
        </a>
        <a class="home-cta safes" href="safes-fit.html?v=28">
          <span class="home-cta-label">Ассеты</span>
          <span class="home-cta-title">Прогон сейфов</span>
        </a>
        <a class="home-cta create" href="create.html">
          <span class="home-cta-label">Редактор</span>
          <span class="home-cta-title">Создать маршрут</span>
        </a>
      </nav>

      <footer class="home-foot">
        <button type="button" class="btn ghost home-install" id="btn-install" hidden>Установить на телефон</button>
        <div class="home-settings">
          <p class="home-settings-label">Настройки</p>
          <button type="button" class="btn primary" id="btn-update-app">Обновить приложение</button>
          <p class="home-note" id="update-note">Та же ссылка · сброс кэша и загрузка новой версии</p>
        </div>
        <p class="home-note" id="home-note"></p>
      </footer>
    </main>
  </div>
  <script src="content-db.js?v=28"></script>
  <script src="monuments-extra.js?v=28"></script>
  <script src="demo-quest.js?v=28"></script>
  <script src="shared.js?v=28"></script>
  <script>
    const active = KP.loadActiveQuest();
    const dbCount = (window.QUEST_DB && QUEST_DB.tasks.length) || 0;
    document.getElementById("home-note").textContent = active
      ? `${active.title} · ${active.steps.length} заданий`
      : `${dbCount} заданий в базе`;

    let deferred;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferred = e;
      document.getElementById("btn-install").hidden = false;
    });
    document.getElementById("btn-install").onclick = async () => {
      if (!deferred) return;
      deferred.prompt();
      deferred = null;
      document.getElementById("btn-install").hidden = true;
    };

    document.getElementById("btn-update-app").onclick = async () => {
      const btn = document.getElementById("btn-update-app");
      const note = document.getElementById("update-note");
      btn.disabled = true;
      note.textContent = "Обновляем…";
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (_) {
        /* всё равно перезагрузим */
      }
      // жёсткий сброс: новая сессия без кэша
      const url = new URL(location.href);
      url.searchParams.set("v", String(Date.now()));
      location.replace(url.pathname + "?" + url.searchParams.toString());
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=28").catch(() => {});
    }
  </script>
</body>
</html>
