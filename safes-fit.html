<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <title>Прогон сейфов — Культурные прогулки</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body class="walk-body">
  <div class="phone-shell" id="app">
    <div class="panel" style="margin:16px;text-align:center">
      <p class="eyebrow">Тест ассетов</p>
      <h1 class="walk-title" style="font-size:1.4rem">Прогон сейфов</h1>
      <p class="muted">Переключайте типы и подгоняйте картинки. Без GPS.</p>
      <p><a href="index.html">← Меню</a></p>
    </div>
  </div>
  <script src="radar.js"></script>
  <script>
    (function () {
      if (!window.KP_Radar) return;
      const radar = new window.KP_Radar({
        targetLat: 55.76,
        targetLon: 37.62,
        unlockM: 35,
        revealM: 300,
        demo: true,
        safeType: "wheel",
        safeCode: "",
        safePrompt: "Крутите ручку · 3 оборота",
        hintText: "Тестовая подсказка после открытия сейфа.",
        needsCalibration: false,
        onUnlock: () => {},
        onClose: () => {
          location.href = "index.html";
        },
      });
      radar.start();
      // сразу показать первый сейф для подгонки
      requestAnimationFrame(() => {
        radar.demoDist = 10;
        radar._updateMetrics();
        radar._forceShowSafeAndFocus();
        radar._syncDemoSafeUi();
      });
    })();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
