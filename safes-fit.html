<!DOCTYPE html>
<html lang="ru" data-theme="slate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e10" />
  <title>Прогон сейфов — Культурные прогулки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=36" />
  <link rel="stylesheet" href="themes.css?v=36" />
  <link rel="manifest" href="manifest.json" />
  <script src="theme.js?v=36"></script>
</head>
<body class="walk-body">
  <div class="phone-shell" id="app">
    <div class="panel" style="margin:16px;text-align:center">
      <p class="eyebrow">Тест ассетов</p>
      <h1 class="walk-title" style="font-size:1.4rem">Прогон сейфов</h1>
      <p class="muted">Сначала выберите тип сейфа — он появится. Крестик закрывает и даёт выбрать другой.</p>
      <p><a href="index.html">← Меню</a></p>
    </div>
  </div>
  <script src="radar.js?v=36"></script>
  <script>
    (function () {
      if (!window.KP_Radar) return;
      const radar = new window.KP_Radar({
        targetLat: 55.76,
        targetLon: 37.62,
        unlockM: 35,
        revealM: 150,
        demo: true,
        fitMode: true,
        safeType: "wheel",
        safeCode: "",
        safePrompt: "Крутите ручку · 3 оборота",
        hintText: "Тестовая подсказка после открытия сейфа.",
        needsCalibration: false,
        onUnlock: () => {},
        onClose: () => {
          location.href = "index.html";
        },
      });
      radar.start();
    })();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=36").catch(() => {});
    }
  </script>
</body>
</html>
